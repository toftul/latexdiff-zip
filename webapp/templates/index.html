<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>latexdiff-zip</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --old: #cc2200;
    --new: #006622;
    --border: #d9dde3;
    --code-bg: #eef1f6;
    --drop-hover: #f0f5ff;
  }
  /* Explicit dark theme, toggled via the button and persisted in localStorage.
     An inline <head> script sets data-theme before first paint (no flash);
     when unset, that script falls back to the OS prefers-color-scheme. */
  :root[data-theme="dark"] {
    --bg: #0f1320; --card: #171c2b; --ink: #e6e9f2; --muted: #9aa3b5;
    --accent: #6ea0ff; --accent-dark: #5b8cf0; --old: #ff8a78; --new: #5fce8f;
    --border: #2a3142;
    --code-bg: #232a3d;
    --drop-hover: rgba(110,160,255,.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 2rem 1rem;
  }
  .card {
    background: var(--card); width: 100%; max-width: 820px;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 2rem; box-shadow: 0 6px 24px rgba(0,0,0,.06);
    position: relative;
  }
  .theme-toggle {
    position: absolute; top: 1rem; right: 1rem;
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    font-size: 1.05rem; line-height: 1; cursor: pointer;
    display: grid; place-items: center; transition: border-color .15s, background .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  h1 code { background: var(--code-bg); padding: .1em .35em; border-radius: 6px; font-size: .9em; }
  p.lead { margin: 0 0 1.5rem; color: var(--muted); }
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 520px) { .drops { grid-template-columns: 1fr; } }
  .drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 1.25rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s; position: relative;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--drop-hover); }
  .drop.ready {
    border-style: solid; border-color: var(--new); background: rgba(0,160,80,.07);
  }
  .drop.ready::after {
    content: '✓'; position: absolute; top: .5rem; right: .65rem;
    color: var(--new); font-weight: 700; font-size: .95rem;
  }
  .drop .tag { font-weight: 700; letter-spacing: .04em; font-size: .8rem; }
  .drop.old .tag { color: var(--old); }
  .drop.new .tag { color: var(--new); }
  .drop .hint { color: var(--muted); font-size: .85rem; margin-top: .35rem; word-break: break-all; }
  .drop input[type=file] { display: none; }
  details { margin: 1.25rem 0 0; border-top: 1px solid var(--border); padding-top: 1rem; }
  summary { cursor: pointer; color: var(--accent); font-size: .92rem; }
  .field { margin-top: .9rem; display: flex; flex-direction: column; gap: .3rem; }
  .field label { font-size: .85rem; color: var(--muted); }
  .field input[type=text], .field select {
    padding: .55rem .6rem; border: 1px solid var(--border); border-radius: 8px; font: inherit;
  }
  .check { flex-direction: row; align-items: center; gap: .5rem; }
  button.go {
    margin-top: 1.5rem; width: 100%; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: .85rem; cursor: pointer; transition: background .15s;
  }
  button.go:hover { background: var(--accent-dark); }
  button.go:disabled { opacity: .6; cursor: progress; }
  #status { margin-top: 1rem; font-size: .9rem; min-height: 1.2em; }
  #status.err { color: var(--old); }
  /* The build log is collapsed into a spoiler by default; the high-level
     progress lives in #status. Override the generic `details` rule above. */
  #logwrap { display: none; margin-top: .75rem; border-top: 0; padding-top: 0; }
  #logwrap > summary { color: var(--muted); font-size: .82rem; }
  #log {
    margin: .5rem 0 0; background: #0f1729; color: #d7e0f5;
    border-radius: 10px; padding: .8rem .9rem; font: .78rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 16rem; overflow: auto;
  }
  #result { margin-top: 1.25rem; display: none; }
  #result iframe { width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: 10px; }
  .result-actions {
    margin-top: .85rem; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center;
  }
  .result-actions a, .result-actions .link-btn {
    color: var(--accent); text-decoration: none; font-weight: 600;
    background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
  }
  .result-actions a:hover, .result-actions .link-btn:hover { text-decoration: underline; }
  .spinner {
    display: inline-block; width: 1em; height: 1em; vertical-align: -.15em;
    border: 2px solid #c7d2fe; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin-right: .4em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  // Set the theme before first paint to avoid a flash of the wrong colors.
  // Stored choice wins; otherwise follow the OS prefers-color-scheme setting.
  (function () {
    try {
      var t = localStorage.getItem('ldz-theme');
      if (t !== 'dark' && t !== 'light') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div class="card">
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    <h1><code>latexdiff-zip</code></h1>
    <p class="lead">Drop two LaTeX project zips (e.g. Overleaf history exports) and get a
      track-changes PDF — with side-by-side OLD/NEW figure comparisons.</p>

    <form id="form">
      <div class="drops">
        <label class="drop old" id="drop-old">
          <div class="tag">OLD VERSION</div>
          <div class="hint" data-default="click or drop a .zip">click or drop a .zip</div>
          <input type="file" name="old_zip" accept=".zip">
        </label>
        <label class="drop new" id="drop-new">
          <div class="tag">NEW VERSION</div>
          <div class="hint" data-default="click or drop a .zip">click or drop a .zip</div>
          <input type="file" name="new_zip" accept=".zip">
        </label>
      </div>

      <details>
        <summary>Advanced options</summary>
        <div class="field">
          <label for="main_tex">Main .tex file (leave blank to auto-detect)</label>
          <input type="text" id="main_tex" name="main_tex" placeholder="paper.tex">
        </div>
        <div class="field">
          <label for="diff_type">Markup style</label>
          <select id="diff_type" name="diff_type">
            {% for t in diff_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
          </select>
        </div>
        <div class="field check">
          <input type="checkbox" id="embed_figs" name="embed_figs" checked>
          <label for="embed_figs">Append figure comparisons to the PDF</label>
        </div>
      </details>

      <button type="submit" class="go" id="go">Generate diff PDF</button>
    </form>

    <div id="status"></div>
    <details id="logwrap">
      <summary>Show build log</summary>
      <pre id="log"></pre>
    </details>
    <div id="result">
      <iframe id="preview" title="diff preview"></iframe>
      <div class="result-actions">
        <a id="download" download="diff.pdf">⬇ Download diff.pdf</a>
        <a id="open-tab" target="_blank" rel="noopener">↗ Open in new tab</a>
        <button type="button" id="restart" class="link-btn">↺ Start over</button>
      </div>
    </div>
  </div>

<script>
  // Wire up each drop zone: show the chosen file name, support drag & drop.
  document.querySelectorAll('.drop').forEach(function (zone) {
    var input = zone.querySelector('input[type=file]');
    var hint = zone.querySelector('.hint');
    function show() {
      hint.textContent = input.files.length ? input.files[0].name
                                            : hint.dataset.default;
      zone.classList.toggle('ready', input.files.length > 0);
    }
    input.addEventListener('change', show);
    ['dragenter', 'dragover'].forEach(function (e) {
      zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (e) {
      zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.remove('over'); });
    });
    zone.addEventListener('drop', function (ev) {
      if (ev.dataTransfer.files.length) { input.files = ev.dataTransfer.files; show(); }
    });
  });

  var form = document.getElementById('form');
  var go = document.getElementById('go');
  // NB: must not be named `status` — a global `var status` aliases the magic
  // window.status string property, which silently coerces this element to a
  // string and makes every status update a no-op.
  var statusEl = document.getElementById('status');
  var logWrap = document.getElementById('logwrap');
  var logBox = document.getElementById('log');
  var result = document.getElementById('result');
  var preview = document.getElementById('preview');
  var download = document.getElementById('download');
  var openTab = document.getElementById('open-tab');
  var restart = document.getElementById('restart');
  var themeToggle = document.getElementById('theme-toggle');
  var timer = null, started = 0, es = null;

  // Dark-mode toggle: overrides the OS setting and persists the choice. The
  // initial data-theme was set by the inline <head> script (light/dark).
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    themeToggle.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  themeToggle.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('ldz-theme', next); } catch (e) {}
    applyTheme(next);
  });
  // If the user hasn't picked a theme, keep following the OS as it changes.
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('ldz-theme')) applyTheme(e.matches ? 'dark' : 'light');
    });
  } catch (e) {}

  // Map the engine's log markers to friendly, numbered build stages so the
  // status line stays informative even though the raw log is collapsed.
  var STAGES = [
    { re: /flattening/i,        label: 'Flattening sources' },
    { re: /running latexdiff/i, label: 'Running latexdiff' },
    { re: /building PDF/i,      label: 'Building PDF' },
    { re: /comparing figures/i, label: 'Comparing figures' },
  ];
  var stageIdx = -1;

  function trackStage(line) {
    for (var i = STAGES.length - 1; i > stageIdx; i--) {
      if (STAGES[i].re.test(line)) { stageIdx = i; tick(); return; }
    }
  }

  // Remember the markup style and figure toggle between visits.
  var PREFS_KEY = 'ldz-prefs';
  function applyPrefs() {
    try {
      var p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
      if (p.diff_type) form.diff_type.value = p.diff_type;
      if (typeof p.embed_figs === 'boolean') form.embed_figs.checked = p.embed_figs;
    } catch (e) {}
  }
  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        diff_type: form.diff_type.value,
        embed_figs: form.embed_figs.checked,
      }));
    } catch (e) {}
  }
  form.diff_type.addEventListener('change', savePrefs);
  form.embed_figs.addEventListener('change', savePrefs);
  applyPrefs();

  function setBusy(busy) { go.disabled = busy; }

  function tick() {
    var secs = Math.round((Date.now() - started) / 1000);
    var label = stageIdx < 0 ? 'Starting build' : STAGES[stageIdx].label;
    var step = stageIdx < 0 ? '' : ' · step ' + (stageIdx + 1) + ' of ' + STAGES.length;
    statusEl.innerHTML = '<span class="spinner"></span>' + label + step + ' — ' + secs + 's';
  }

  function appendLog(line) {
    var atBottom = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 4;
    logBox.textContent += line + '\n';
    if (atBottom) logBox.scrollTop = logBox.scrollHeight;
  }

  function finish() {
    if (timer) { clearInterval(timer); timer = null; }
    if (es) { es.close(); es = null; }
    setBusy(false);
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();

    // The file inputs are display:none (hidden inside the drop zones), so the
    // browser's native `required` validation can't show its popup — it would
    // just silently refuse to submit. Validate here and show a real message.
    var oldFile = form.old_zip.files.length;
    var newFile = form.new_zip.files.length;
    if (!oldFile || !newFile) {
      statusEl.className = 'err';
      statusEl.textContent = !oldFile && !newFile
        ? 'Please choose both the OLD and the NEW .zip files.'
        : (!oldFile ? 'Please choose the OLD .zip file.'
                    : 'Please choose the NEW .zip file.');
      return;
    }

    statusEl.className = '';
    result.style.display = 'none';
    logWrap.style.display = 'block';
    logWrap.open = false;          // keep the log spoiler collapsed by default
    logBox.textContent = '';
    setBusy(true);
    started = Date.now();
    stageIdx = -1;
    tick();
    timer = setInterval(tick, 1000);

    var id;
    try {
      var res = await fetch('/jobs', { method: 'POST', body: new FormData(form) });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        statusEl.className = 'err';
        statusEl.textContent = data.error || ('Could not start build (HTTP ' + res.status + ')');
        finish();
        return;
      }
      id = data.id;
    } catch (e) {
      statusEl.className = 'err';
      statusEl.textContent = 'Request failed: ' + e;
      finish();
      return;
    }

    // Stream the build log live.
    es = new EventSource('/jobs/' + id + '/events');
    es.onmessage = function (e) { appendLog(e.data); trackStage(e.data); };
    es.addEventListener('done', function (e) {
      finish();
      if (e.data === 'DONE') {
        statusEl.className = '';
        statusEl.textContent = '✔ Done.';
        var pdfUrl = '/jobs/' + id + '/pdf';
        preview.src = pdfUrl;
        download.href = pdfUrl;
        openTab.href = pdfUrl;
        result.style.display = 'block';
      } else {
        statusEl.className = 'err';
        statusEl.textContent = '✖ Build failed — see the log below.';
        logWrap.open = true;       // auto-expand the log so the error is visible
      }
    });
    es.onerror = function () {
      // Connection dropped; if we never finished, report it.
      if (es) {
        finish();
        statusEl.className = 'err';
        statusEl.textContent = '✖ Lost connection to the build log.';
      }
    };
  });

  // "Start over": clear the previous result and selected files for a fresh run.
  restart.addEventListener('click', function () {
    finish();
    form.reset();
    applyPrefs();   // form.reset() wiped the persisted options; restore them
    document.querySelectorAll('.drop').forEach(function (zone) {
      zone.classList.remove('ready');
      var hint = zone.querySelector('.hint');
      hint.textContent = hint.dataset.default;
    });
    result.style.display = 'none';
    logWrap.style.display = 'none';
    statusEl.className = '';
    statusEl.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
